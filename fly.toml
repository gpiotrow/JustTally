# fly.toml app configuration file generated for justtally on 2026-08-09T12:36:08+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'justtally'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    # Baked into the frontend's service worker at build time — matches
    # MEDIA_PUBLIC_BASE_URL, the R2 secret set via `fly secrets set`.
    VITE_MEDIA_ORIGIN = 'https://media.justtally.org'

[deploy]
  release_command = 'node src/db/seed.js'

[env]
  ALLOW_REGISTRATION = 'off'
  # MEDIA_DRIVER is set via `fly secrets set`, not here — keeping it in only
  # one place avoids relying on undocumented precedence if both were set.
  NODE_ENV = 'production'
  PORT = '4000'
  UPLOADS_DIR = '/data/uploads'

[[mounts]]
  source = 'justtally_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
